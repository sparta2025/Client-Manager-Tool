openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client (lawyer's case) operations
  - name: stages
    description: Case stage journal operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/summary:
    get:
      operationId: getClientsSummary
      tags: [clients]
      summary: Count of clients per status
      responses:
        "200":
          description: Counts per status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientsSummary"
  /clients/{clientId}/stages:
    get:
      operationId: listClientStages
      tags: [stages]
      summary: List stages for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of stages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseStage"
        "404":
          description: Client not found
    post:
      operationId: createClientStage
      tags: [stages]
      summary: Create a stage for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseStageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStage"
        "404":
          description: Client not found
  /clients/{clientId}/stats:
    get:
      operationId: getClientStats
      tags: [stages]
      summary: Statistics for a single client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientStats"
        "404":
          description: Client not found
  /stages/{id}:
    patch:
      operationId: updateStage
      tags: [stages]
      summary: Update a case stage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseStageUpdate"
      responses:
        "200":
          description: Updated stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStage"
        "404":
          description: Stage not found
    delete:
      operationId: deleteStage
      tags: [stages]
      summary: Delete a case stage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Stage not found
  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client (e.g. change status)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Client not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ClientStatus:
      type: string
      enum: [new, in_progress, closed]
    Client:
      type: object
      required: [id, name, phone, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        status:
          $ref: "#/components/schemas/ClientStatus"
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
    ClientInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/ClientStatus"
        createdAt:
          type: string
          format: date-time
    ClientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/ClientStatus"
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
    CaseStage:
      type: object
      required: [id, clientId, name, stageDate, isCompleted, createdAt, updatedAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        name:
          type: string
        stageDate:
          type: string
          format: date-time
        content:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        isCompleted:
          type: boolean
        failureReasons:
          type: string
          nullable: true
        nextPlans:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CaseStageInput:
      type: object
      required: [name, stageDate]
      properties:
        name:
          type: string
          minLength: 1
        stageDate:
          type: string
          format: date-time
        content:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        isCompleted:
          type: boolean
        failureReasons:
          type: string
          nullable: true
        nextPlans:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
    CaseStageUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        stageDate:
          type: string
          format: date-time
        content:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        isCompleted:
          type: boolean
        failureReasons:
          type: string
          nullable: true
        nextPlans:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
    ClientStats:
      type: object
      required: [clientId, totalStages, completedStages, activeStages]
      properties:
        clientId:
          type: integer
        totalStages:
          type: integer
        completedStages:
          type: integer
        activeStages:
          type: integer
        lastStageDate:
          type: string
          format: date-time
          nullable: true
        lastNextPlans:
          type: string
          nullable: true
    ClientsSummary:
      type: object
      required: [new, in_progress, closed, total]
      properties:
        new:
          type: integer
        in_progress:
          type: integer
        closed:
          type: integer
        total:
          type: integer

